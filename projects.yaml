version: 1
projects:
  - id: hosaka-context
    name: Hosaka
    description: Terminal-first appliance, source and Docker distribution, and isolated hosted terminal.
    status: active
    parent: null
    links: []
  - id: hosaka-gateway
    name: Hosaka Gateway
    description: Generic authenticated web front door serving approved Hosaka extension web apps at /{extension_id}/.
    status: active
    parent: null
    links:
      - type: uses
        target: hosaka-context
        reason: Reads Hosaka's extension registry, verifies web-source digests and grants, and manages isolated per-app ASGI workers.
  - id: hosaka-citations
    name: Hosaka Citations
    description: Offline-first citations extension (id citations), local mobile web UI, portable cite CLI, and hosted Vercel wall.
    status: active
    parent: null
    links:
      - type: uses
        target: hosaka-context
        reason: Runs as trusted-local extension citations on the generic Hosaka host with dedicated extension-data/citations/citations.db.
      - type: uses
        target: hosaka-gateway
        reason: Exposes web/local/ at /citations/ through Hosaka Gateway.
  - id: virgo-zone
    name: VirgoZone
    description: LAN social application and citations wall with local comments, served via Hosaka Gateway (/virgo-zone/).
    status: active
    parent: null
    links:
      - type: uses
        target: hosaka-citations
        reason: Imports the stdlib citations package and shares the canonical extension-data/citations/citations.db database without duplication.
      - type: uses
        target: hosaka-context
        reason: Ships extension/ (id virgo-zone) under the Hosaka extension contract v1 with dedicated extension-data/virgo-zone/virgo-zone.db.
      - type: uses
        target: hosaka-gateway
        reason: Exposes web/local/ at /virgo-zone/ and launches via virgozone-start.
